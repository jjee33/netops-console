name: Security

on:
  schedule:
    # Weekly. The image bundles nmap, OpenSSL, and a Debian base — a release
    # that was clean when published does not stay clean.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "docker/Dockerfile"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Python dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -e '.[dev]'

      - name: pip-audit
        run: pip-audit --strict --desc

  image:
    name: Published image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Trivy scan of :latest
        # Findings are uploaded rather than failing the run, so a new CVE in the
        # base image raises an alert instead of breaking an unrelated push. The
        # release workflow is where a scan gates publication.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-scheduled

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
