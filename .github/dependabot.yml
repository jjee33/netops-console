version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; anything security-relevant is worth reading
      # on its own, so cryptography, argon2, and asyncssh stay ungrouped.
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["cryptography", "argon2-cffi", "asyncssh"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
