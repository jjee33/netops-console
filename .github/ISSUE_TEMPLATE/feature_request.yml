name: Feature request
description: Suggest something for a future version
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        This project has a deliberately narrow scope. The following are decided,
        not pending, and requests for them will be closed:

        SNMP monitoring or graphing · topology mapping · multi-site or MSP
        multi-tenancy · Kubernetes · agents on managed devices · AI diagnostics ·
        a browser-based interactive SSH terminal · Windows remote management

        Already planned for after v0.1: live output streaming, scheduled
        discovery, IPv6, RBAC, Wake-on-LAN.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation you are in, not the feature you imagine. It may have a simpler answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the out-of-scope list above and this is not on it
          required: true
