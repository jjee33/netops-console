<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetOps Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:,">
  {# HTMX injects an inline <style> for its loading indicator by default, which
     the CSP (style-src 'self') blocks and logs as an error on every page. The
     same rules live in app.css, so the injection is switched off. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  {# CSP forbids inline script, so HTMX is vendored rather than loaded from a CDN. #}
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
{# hx-headers puts the CSRF token on every HTMX request. Forms carry it as a
   hidden field instead; both paths are checked by the same middleware. #}
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
<a class="skip-link" href="#main">Skip to content</a>

{% if current_user %}
<header class="topbar">
  <a class="brand" href="/">NetOps&nbsp;Console</a>
  <nav aria-label="Main">
    {% set path = request.url.path %}
    {% for href, label, active in [
         ('/', 'Dashboard', path == '/'),
         ('/devices', 'Devices', path.startswith('/devices')),
         ('/discovery', 'Discovery', path.startswith('/discovery')),
         ('/actions', 'Actions', path.startswith('/actions')),
         ('/credentials', 'Credentials', path.startswith('/credentials')),
         ('/audit', 'Audit', path.startswith('/audit')),
         ('/settings', 'Settings', path == '/settings')] %}
    {# aria-current, not only a class, so screen readers announce the section. #}
    <a href="{{ href }}" {% if active %}class="active" aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  <div class="topbar-right">
    <span class="user">{{ current_user.username }}</span>
    <a href="/account/password">Password</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="link-button">Log out</button>
    </form>
  </div>
</header>
{% endif %}

<main class="container" id="main" tabindex="-1">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>NetOps Console {{ version }}</span>
  <span class="sep">·</span>
  <span>Manage only networks you are authorised to manage.</span>
</footer>

</body>
</html>
